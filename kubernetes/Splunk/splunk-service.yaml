apiVersion: v1
kind: Service
metadata:
  name: splunk
  namespace: splunk
spec:
  selector:
    app: splunk
  type: LoadBalancer
  ports:
    # Splunk Web UI
    - name: web
      port: 8000
      targetPort: 8000
    # HTTP Event Collector (HEC) — for structured log ingestion
    - name: hec
      port: 8088
      targetPort: 8088
    # The management port (8089) is deliberately NOT exposed here.
    # It is the full Splunk REST API with admin rights; a LoadBalancer puts it
    # on the LAN for every device. It is reachable in-cluster via the
    # splunk-mgmt Service below, or from your workstation with:
    #   kubectl -n splunk port-forward svc/splunk-mgmt 8089:8089
---
# Management API — cluster-internal only, no LoadBalancer IP.
apiVersion: v1
kind: Service
metadata:
  name: splunk-mgmt
  namespace: splunk
spec:
  selector:
    app: splunk
  type: ClusterIP
  ports:
    - name: mgmt
      port: 8089
      targetPort: 8089
---
# Separate service for syslog UDP — LoadBalancer with UDP
apiVersion: v1
kind: Service
metadata:
  name: splunk-syslog
  namespace: splunk
spec:
  selector:
    app: splunk
  type: LoadBalancer
  ports:
    # Router still sends to 514; splunkd listens on 1514 inside the pod.
    - name: syslog-udp
      port: 514
      targetPort: 1514
      protocol: UDP
